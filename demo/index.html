<style>
  :root{
    --bg:#0E0B0D; --card:#191315; --muted:#231A1E; --line:rgba(255,226,205,.11);
    --fg:#F4EDE7; --soft:#A99B95; --iris:#E9B955; --lend:#F0C86A; --crimson:#D6334F;
    --iris-metal:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,0) 55%,rgba(110,10,30,.16) 100%),linear-gradient(115deg,#C41E3A 0%,#DE4A4A 28%,#EE8A4B 56%,#F3B94D 80%,#F7D580 100%);
    --iris-glow:linear-gradient(100deg,#F26A6A 0%,#F0884E 40%,#F2B84B 75%,#F8DE92 100%);
    --ink:#2B0A10; --r:14px;
    --fill1:#3A1C25;--fill2:#2B151C;--bar:rgba(14,11,13,.95);--chip:rgba(14,11,13,.78);--scrim:rgba(14,11,13,.7);--hot:#FF6F7D;--top:rgba(14,11,13,.82);--dots:rgba(255,226,205,.045);
    --nav:calc(72px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:14px 14px}
  button,input,textarea,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer;padding:0}
  :focus-visible{outline:2px solid var(--iris);outline-offset:2px}
  .press{transition:transform .12s}.press:active{transform:scale(.96)}
  main{max-width:448px;margin:0 auto;min-height:100dvh;padding:calc(52px + env(safe-area-inset-top) + 20px) 16px calc(var(--nav) + 32px)}
  body.inchat main{padding-top:24px}body.inchat .top{display:none}
  h1{font-size:24px;margin:0 0 4px}
  h2{margin:0}
  .glow{background:var(--iris-glow);-webkit-background-clip:text;background-clip:text;color:transparent}
  .eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
  .small{font-size:11px;color:var(--soft)}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .stack{display:grid;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--crimson);display:inline-block;flex-shrink:0}
  .pulse{animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}
  .input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;outline:none;color-scheme:dark}
  .input:focus{border-color:var(--iris)}
  textarea.input{resize:vertical}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--muted);border-radius:12px;padding:4px;margin:12px 0;font-size:11px}
  .seg.two{grid-template-columns:repeat(2,1fr)}
  .seg button{padding:9px 0;border-radius:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
  .seg button.on{background:var(--iris-metal);color:var(--ink);font-weight:700}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 4px;scrollbar-width:none}
  .chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
  .chip{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--soft)}
  .chip.on{border-color:var(--iris);background:var(--fill1);color:var(--fg)}
  .tag{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:10px;color:var(--soft)}
  .tag.hot{border-color:rgba(214,51,79,.5);color:var(--hot)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;cursor:pointer;position:relative}
  .card.dim .thumb,.card.dim .body{opacity:.55}
  .thumb{aspect-ratio:1;display:grid;place-items:center;background:var(--muted);font-size:48px;position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .card .body{padding:12px}
  .title{font-size:12px;font-weight:700;margin:6px 0 4px;line-height:1.35}
  .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .badge.lend{background:rgba(233,185,85,.16);color:var(--lend)}
  .badge.borrow{background:rgba(214,51,79,.2);color:var(--hot)}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:10px;font-weight:700;white-space:nowrap}
  .pill.iris{background:var(--fill1);color:var(--iris)}
  .pill.lend{background:rgba(233,185,85,.16);color:var(--lend)}
  .pill.soft{background:var(--muted);color:var(--soft)}
  .pill.red{background:rgba(214,51,79,.2);color:var(--hot)}
  .heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--chip);font-size:16px;color:var(--fg);z-index:1}
  .heart.on{color:var(--hot)}
  .ribbon{position:absolute;left:8px;bottom:8px;background:var(--chip);border-radius:999px;padding:3px 9px;font-size:10px;color:var(--soft)}
  .btn{display:block;width:100%;background:var(--iris-metal);color:var(--ink);font-weight:700;font-size:14px;border-radius:12px;padding:14px;text-align:center}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:var(--muted);color:var(--fg);border:1px solid var(--line)}
  .btn.sm{padding:10px 12px;font-size:12px}
  .link{color:var(--soft);font-size:12px;text-decoration:underline;text-underline-offset:3px}
  .link.danger{color:var(--hot);display:block;margin:14px auto 0}
  .empty{text-align:center;padding:60px 0;font-size:13px;color:var(--soft);line-height:1.5}
  .label{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:16px 0 6px}
  .pick{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left}
  .pick.on{border-color:var(--iris);background:var(--fill2)}
  .pick:disabled{opacity:.45}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:18px}
  .list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .list li{border-bottom:1px solid var(--line)}.list li:last-child{border:0}
  .list a,.list .item{display:flex;align-items:center;gap:12px;padding:12px;text-decoration:none;color:inherit;width:100%;text-align:left}
  .item[role=button]{cursor:pointer}
  .avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--muted);font-size:20px;flex-shrink:0}
  .trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .loc{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--soft)}
  .filter{flex-shrink:0;width:48px;align-self:stretch;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
  .filter.on{border-color:var(--iris);background:var(--fill2)}
  .sheet-bg{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(4px);display:flex;align-items:flex-end}
  .sheet{width:100%;max-width:448px;margin:0 auto;max-height:92dvh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom))}
  .sheet.anim{animation:up .25s ease}
  @keyframes up{from{transform:translateY(100%)}}
  .x{background:var(--muted);border-radius:50%;width:30px;height:30px;flex-shrink:0}
  .x.on{color:var(--hot)}
  .gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}
  .gallery img{flex:0 0 100%;height:200px;object-fit:cover;scroll-snap-align:center;border-radius:16px}
  .chat{display:flex;flex-direction:column;min-height:calc(100dvh - 130px)}
  .chat-head{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:12px 16px;margin:-24px -16px 0}
  .msgs{flex:1;display:flex;flex-direction:column;gap:8px;padding:16px 0}
  .bubble{max-width:78%;padding:8px 14px;border-radius:18px;font-size:14px;background:var(--card);overflow-wrap:anywhere}
  .bubble .t{display:block;font-size:9px;opacity:.55;margin-top:2px}
  .bubble.me{align-self:flex-end;background:var(--iris-metal);color:var(--ink);border-bottom-right-radius:4px}
  .bubble.them{align-self:flex-start;border-bottom-left-radius:4px}
  .sys{align-self:center;font-size:11px;color:var(--soft);text-align:center;padding:4px 12px;border:1px dashed var(--line);border-radius:999px;max-width:90%}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--soft);animation:p 1s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  .cwrap{position:sticky;bottom:var(--nav);background:var(--bg);padding-bottom:10px}
  .quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
  .quick button{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--soft)}
  .composer{display:flex;gap:8px}
  .composer input{flex:1;border-radius:999px;padding:10px 16px}
  .send{width:42px;height:42px;border-radius:50%;background:var(--iris-metal);color:var(--ink);font-weight:700}
  .obar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
  .obar .acts{display:flex;gap:6px;flex-shrink:0}
  .obar .btn{width:auto;padding:8px 12px;font-size:11px}
  .co{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .co hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12px}
  .kv dt{color:var(--soft)}.kv dd{margin:0;text-align:right}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}
  .steps div{font-size:10px;color:var(--soft);padding-top:8px;border-top:3px solid var(--muted)}
  .steps div.done{color:var(--fg);border-color:var(--lend)}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--muted);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--soft);transition:transform .2s}
  .switch.on{background:var(--iris-metal)}.switch.on::after{transform:translateX(18px);background:var(--ink)}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
  input[type=range]{width:100%;accent-color:var(--iris)}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper b{min-width:60px;text-align:center;font-size:16px}
  .star{font-size:34px;color:var(--muted);padding:0 4px;line-height:1}
  .star.on{color:#F8D9B4}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .photos>*{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative}
  .photos img{width:100%;height:100%;object-fit:cover}
  .photos .add{display:grid;place-items:center;border:1px dashed var(--iris);color:var(--iris);font-size:11px;text-align:center;cursor:pointer;background:var(--card);padding:6px}
  .photos .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--chip);font-size:11px}
  .bars{display:flex;align-items:flex-end;gap:10px;margin-top:14px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
  .bar i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--muted)}
  .bar i.cur{background:var(--iris-metal)}
  .bar .small{font-size:9px}
  .flames{letter-spacing:2px}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .bdg{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:12px;font-size:10px;color:var(--soft)}
  .bdg b{display:block;font-size:20px;margin-bottom:2px;filter:grayscale(1);opacity:.4}
  .bdg.on{color:var(--fg);border-color:var(--iris);background:var(--fill2)}
  .bdg.on b{filter:none;opacity:1}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .section{margin:28px 0 8px;font-size:14px;font-weight:700}
  .toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fill2);border:1px solid var(--iris);padding:10px 16px;border-radius:999px;font-size:12px;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bar);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom),8px)}
  nav .tabs{max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
  nav .ico{width:48px;height:34px;border-radius:999px;display:grid;place-items:center;position:relative}
  nav button.on{color:var(--fg)} nav button.on .ico{background:var(--iris-metal);color:var(--ink)}
  .nb{position:absolute;top:-3px;right:0;min-width:16px;height:16px;border-radius:999px;background:var(--crimson);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px;font-weight:700;letter-spacing:0}
  svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const mango = (c="") => MANGO_SRC.replace("<svg ", `<svg class="mango ${c}" `);
const logo = () => `<button class="logo" aria-label="Mazingo. Tap for juice." onclick="logoTap(event)">mazingo${mango("logo-mango")}</button>`;
const JUICE = ["#F3B94D","#E8A33D","#DE4A4A","#C41E3A","#F7D580","#EE8A4B"];
function burst(x, y, n = 24){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  for (let i = 0; i < n; i++){
    const d = document.createElement("div"), s = 4 + Math.random()*8, a = Math.random()*Math.PI*2, v = 50 + Math.random()*130;
    d.className = "drop" + (Math.random() < .3 ? " tear" : "");
    d.style.cssText = `width:${s}px;height:${s*(Math.random()<.3?1.6:1)}px;left:${x}px;top:${y}px;background:${JUICE[i%JUICE.length]}`;
    document.body.appendChild(d);
    d.animate([{transform:"translate(0,0)",opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v-40}px)`,opacity:1,offset:.5},
      {transform:`translate(${Math.cos(a)*v*1.2}px,${Math.sin(a)*v+110}px)`,opacity:0}],{duration:700+Math.random()*500,easing:"cubic-bezier(.17,.67,.35,1)"}).onfinish = () => d.remove();
  }
}
function logoTap(e){
  const el = e.currentTarget; el.classList.remove("squeezed"); void el.offsetWidth; el.classList.add("squeezed");
  const r = el.querySelector(".mango").getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 26);
  if (navigator.vibrate) navigator.vibrate(10);
}
const celebrate = () => burst(innerWidth/2, innerHeight*.6, 34);
function applyTheme(t, persist){
  document.documentElement.dataset.theme = t;
  document.querySelector("meta[name=theme-color]").content = t === "light" ? "#D9DCE1" : "#0E0B0D";
  if (persist) try { localStorage.setItem("mazingo-theme", t); } catch {}
}
function toggleTheme(){ applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light", true); render(); }

function slideIn(el, dir, px = 38){
  if (!el || RM()) return;
  el.animate([{transform:`translateX(${dir*px}px)`, opacity:0}, {transform:"none", opacity:1}], {duration:340, easing:"cubic-bezier(.2,.8,.2,1)"});
}
function runInd(){

}

};

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n*100)/100;
const eur = n => { n = r2(n); return "€" + (Number.isInteger(n) ? n : n.toFixed(2)); };
const iso = d => { const t = new Date(d); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0,10); };
const dayOffset = n => iso(Date.now() + n*864e5);
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = s => new Date(s + "T12:00:00").toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short"});
const fmtTime = ts => {
  const d = new Date(ts), now = new Date(), mins = (now - d) / 6e4;
  if (mins < 1) return "now";
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
  if (mins < 60*24*6) return d.toLocaleDateString("en-GB", {weekday:"short"});
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
};
const initials = n => String(n).split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const pick = a => a[Math.floor(Math.random() * a.length)];
const num = v => Math.max(0, parseFloat(v) || 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const key = (e, fn) => { if (e.target !== e.currentTarget) return; if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };

const KEY = "mazingo-app-v2", OLD = "mazingo-app-v1";
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 2) { s.sim = s.sim || []; s.saved = s.saved || []; return s; } } catch {}
  const d = seed();
  try { /* carry over listings and chats from v1 */
    const o = JSON.parse(localStorage.getItem(OLD));
    if (o && o.listings) {
      o.listings.filter(l => l.mine).reverse().forEach(l => {
        const wish = l.kind === "borrow";
        d.listings.unshift(L({id:l.id, kind:l.kind, title:l.title, category:l.category, emoji:l.emoji,
          price: wish ? l.price*3 : l.price, days: wish ? 3 : 0, deposit: wish ? 0 : l.deposit,
          description:l.description || "", owner:"You", mine:true, rating:d.me.rating, campus:d.me.campus, km:0, area:d.me.area}));
      });
      (o.threads || []).filter(t => !["t1","t2"].includes(t.id)).forEach(t => d.threads.unshift({
        id:t.id, listingId:t.listingId, with:t.with, unread:false,
        messages:(t.messages || []).map(m => ({...m, ts:m.ts || Date.now()}))}));
    }
  } catch {}
  return d;
}

/* Request to borrow / I have this */
function startRequest(id){
  const l = getListing(id);
  ui.req = {id, start:dayOffset(1), days:Math.min(3, l.maxDays || 3), mode:"listed", rate:l.price, note:""};
  openSheet({t:"request", id});
}
function reqSummary(l, rq){
  if (l.kind === "borrow") {
    const custom = rq.mode === "offer", p = custom ? rq.rate : l.price, diff = r2(p - l.price);
    return `<dl class="kv"><dt>Listed bounty</dt><dd>${eur(l.price)}</dd>${custom ? `<dt>Your price</dt><dd>${eur(p)}${diff ? ` <span class="small">(${diff > 0 ? "+" : "−"}${eur(Math.abs(diff))})</span>` : ""}</dd>` : ""}
      <dt>Needed for</dt><dd>${plural(l.days,"day")}</dd><dt>You earn on handover</dt><dd><b class="glow">${eur(p)}</b></dd></dl>
      ${custom ? `<p class="small" style="margin:10px 0 0">${esc(String(l.owner).split(" ")[0])} can accept, decline or counter your price.</p>` : ""}`;
  }
  const rate = rq.mode === "offer" ? rq.rate : l.price, cost = rate * rq.days, fee = r2(cost * feeRate(l.rating));
  return `<dl class="kv"><dt>Rate</dt><dd>${eur(rate)}/day</dd><dt>Duration</dt><dd>${plural(rq.days,"day")}</dd><dt>Due back</dt><dd>${rq.start?fmtDate(addDays(rq.start,rq.days)):"—"}</dd>
    <dt>Rental cost</dt><dd>${eur(cost)}</dd><dt>Service fee (${Math.round(feeRate(l.rating)*100)}%)</dt><dd>${eur(fee)}</dd>
    <dt><b style="color:var(--fg)">Due at pickup</b></dt><dd><b class="glow">${eur(cost+fee)}</b></dd>
    <dt>Deposit (refundable)</dt><dd>${eur(l.deposit)}</dd></dl>
    <p class="small" style="margin:10px 0 0">Mazingo holds the deposit once ${esc(String(l.owner).split(" ")[0])} accepts and releases it at check-in.</p>`;
}
function sRequest(s){
  const l = getListing(s.id), rq = ui.req; if (!l || !rq) return `<p class="empty">Something went wrong. Close this and try again.</p>`;
  const wish = l.kind === "borrow";
  return `
    <div class="row between" style="margin-bottom:12px"><button class="small press" onclick="openItem('${l.id}')">← Back</button>${xBtn}</div>
    <div class="row" style="margin-bottom:4px"><span class="avatar">${l.emoji}</span><div class="trunc"><b style="font-size:14px">${esc(l.title)}</b><div class="small">${wish?"Wish by":"Lender"} ${esc(l.owner)}</div></div></div>
    ${wish?"":`
    <div class="label">Pickup date</div>
    ${dayStrip()}<div class="small" style="margin:10px 0 6px">Or choose another date</div>
    <input class="input" type="date" min="${dayOffset(0)}" value="${rq.start}" aria-label="Pickup date" oninput="ui.req.start=this.value;document.querySelectorAll('.day.on').forEach(b=>b.classList.remove('on'));updReq()">
    
    <div class="label">How many days</div>
    <div class="stepper"><button class="x press" aria-label="One day less" onclick="stepDays(-1)">−</button><b id="dv">${plural(rq.days,"day")}</b><button class="x press" aria-label="One day more" onclick="stepDays(1)">+</button><span class="small">max ${l.maxDays}</span></div>
    ${l.acceptOffers?`<div class="seg two"><button class="press ${rq.mode==="listed"?"on":""}" onclick="setMode('listed')">Listed rate</button><button class="press ${rq.mode==="offer"?"on":""}" onclick="setMode('offer')">Make an offer</button></div>
    ${rq.mode==="offer"?`<div class="label">Your offer (per day, €)</div><input class="input" type="number" inputmode="decimal" min="0" step="0.5" value="${rq.rate}" aria-label="Your offer per day" oninput="ui.req.rate=num(this.value);updReq()">`:""}`:""}`}
    ${wish ? wishPrice(l, rq) : ""}
    <div class="label">Note to ${esc(String(l.owner).split(" ")[0])} (optional)</div>
    <textarea class="input" rows="2" placeholder="${wish?"When can you bring it?":"What will you use it for?"}" oninput="ui.req.note=this.value">${esc(rq.note)}</textarea>
    <div class="panel" style="margin:16px 0" id="sum">${reqSummary(l, rq)}</div>
    <button id="sendBtn" class="btn press" onclick="sendRequest()">${reqBtn(l, rq)}</button>`;
}
const dayStrip = () => `<div class="days" role="group" aria-label="Pickup day">${Array.from({length:14}, (_, n) => {
  const iso0 = dayOffset(n), d = new Date(iso0 + "T12:00:00");
  return `<button class="day press ${ui.req.start === iso0 ? "on" : ""}" aria-pressed="${ui.req.start === iso0}" onclick="setStart(${n})"><span>${n === 0 ? "Today" : d.toLocaleDateString("en-GB",{weekday:"short"})}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString("en-GB",{month:"short"})}</span></button>`; }).join("")}</div>`;
function updReq(){ const l = getListing(ui.req.id), el = $("sum"); if (el && l) el.innerHTML = reqSummary(l, ui.req); const b = $("sendBtn"); if (b && l) b.textContent = reqBtn(l, ui.req); }
const reqBtn = (l, rq) => l.kind !== "borrow" ? "Send offer" : rq.mode === "offer" ? `Send my price · ${eur(rq.rate || 0)}` : `Accept for ${eur(l.price)}`;
const wishPrice = (l, rq) => `<div class="label"><span>Your price</span></div>
  <div class="seg two"><button class="press ${rq.mode === "offer" ? "" : "on"}" onclick="setMode('listed')">Accept ${eur(l.price)}</button><button class="press ${rq.mode === "offer" ? "on" : ""}" onclick="setMode('offer')">Name my price</button></div>
  ${rq.mode === "offer" ? `<div class="label"><span>Your price (€)</span></div><input class="input" type="number" inputmode="decimal" min="0" step="1" value="${rq.rate}" aria-label="Your price in euros" oninput="ui.req.rate=num(this.value);updReq()">
  <div class="chips" style="margin-top:8px">${[2,5,10].map(n => `<button class="chip press" onclick="bumpPrice(${n})">+${eur(n)}</button>`).join("")}</div>` : ""}`;
function bumpPrice(n){ const l = getListing(ui.req.id); ui.req.mode = "offer"; ui.req.rate = r2(l.price + n); renderSheet(); }
function setStart(n){ ui.req.start = dayOffset(n); renderSheet(); }
function setMode(m){ ui.req.mode = m; if (m === "offer" && !ui.req.rate) ui.req.rate = getListing(ui.req.id).price; renderSheet(); }
function stepDays(d){
  const l = getListing(ui.req.id); ui.req.days = Math.min(l.maxDays || 30, Math.max(1, ui.req.days + d));
  $("dv").textContent = plural(ui.req.days, "day"); updReq();
}
function ensureThread(l){
  let t = db.threads.find(x => x.listingId === l.id && x.with === l.owner);
  if (!t) { t = {id:uid("t"), listingId:l.id, with:l.owner, unread:false, messages:[]}; db.threads.unshift(t); }
  return t;
}
function addMsg(t, from, text){
  t.messages.push({from, text, ts:Date.now()});
  if (from === "them" && !(ui.tab === "texts" && ui.thread === t.id)) t.unread = true;
}
function sendRequest(){
  const rq = ui.req, l = rq && getListing(rq.id); if (!l) return;
  const wish = l.kind === "borrow", t = ensureThread(l);
  const base = {id:uid("r"), no:String(1000 + Math.floor(Math.random()*9000)), listingId:l.id, threadId:t.id, title:l.title, emoji:l.emoji,
    other:l.owner, pickup:l.pickup || l.area || "", createdAt:Date.now(), status:"offered", incoming:false, seed:false};
  let r;
  if (wish) {
    const price = rq.mode === "offer" ? rq.rate : l.price, custom = price !== l.price, note = rq.note.trim();
    if (!(price > 0)) return toast("Enter a price above €0.");
    r = {...base, role:"lender", kind:"bounty", start:dayOffset(0), days:l.days, rate:0, cost:price, fee:0, deposit:0};
    addMsg(t, "me", custom ? `Offer: ${eur(price)} instead of ${eur(l.price)}.${note ? " " + note : ""}` : (note || `Hi! I have the ${l.title.toLowerCase()} and can lend it.`));
    addMsg(t, "sys", `Offer sent. You earn ${eur(price)} on handover if accepted.`);
  } else {
    if (!rq.start || rq.start < dayOffset(0)) return toast("Pick a pickup date from today on.");
    const rate = rq.mode === "offer" ? rq.rate : l.price;
    if (!(rate > 0)) return toast("Enter an offer above €0 per day.");
    const cost = rate * rq.days, fee = r2(cost * feeRate(l.rating));
    r = {...base, role:"borrower", kind:"lend", start:rq.start, days:rq.days, rate, cost, fee, deposit:l.deposit};
    addMsg(t, "me", `Offer: ${plural(rq.days,"day")} from ${fmtDate(rq.start)} at ${eur(rate)}/day.${rq.note.trim() ? " " + rq.note.trim() : ""}`);
    addMsg(t, "sys", `Offer sent. Deposit of ${eur(l.deposit)} is held once it's accepted.`);
  }
  db.rentals.unshift(r); db.sim.push({at:Date.now() + 2800, type:"resolve", rentalId:r.id}); save();
  closeSheet(); toast("Offer sent"); openThread(t.id);
}

/* Check-in */
function openCheckin(id){ ui.rate = 5; openSheet({t:"checkin", id}); }
function sCheckin(s){
  const r = getRental(s.id); if (!r) return `<p class="empty">Card not found.</p>`;
  const lender = r.role === "lender";
  return `<div class="row between" style="margin-bottom:12px"><b style="font-size:16px">${lender?"Mark as returned":"Check back in"}</b>${xBtn}</div>
    <div class="row"><span class="avatar">${r.emoji}</span><div class="trunc"><b style="font-size:14px">${esc(r.title)}</b><div class="small">Checkout card No. ${r.no}</div></div></div>
    <p style="font-size:13px;line-height:1.5">${lender
      ? `Confirm ${esc(r.other)} handed it back in good shape. You earn <b class="glow">${eur(r.cost)}</b>.`
      : r.deposit ? `Confirm the handoff. Your deposit of <b class="glow">${eur(r.deposit)}</b> is released automatically.` : "Confirm the handoff and close this card."}</p>
    <div class="label"><span>Rate the handoff</span></div>
    <div class="row" style="justify-content:center;gap:0">${[1,2,3,4,5].map(n => `<button class="star press ${n<=ui.rate?"on":""}" aria-label="${n} star${n>1?"s":""}" aria-pressed="${n<=ui.rate}" onclick="ui.rate=${n};renderSheet()">★</button>`).join("")}</div>
    <div style="height:16px"></div><button class="btn press" onclick="confirmCheckin('${r.id}')">Confirm check-in</button>`;
}
function confirmCheckin(id){
  const r = getRental(id), me = db.me; if (!r || r.status !== "claimed") return closeSheet();
  r.status = "returned"; r.handoff = ui.rate; r.returnedAt = Date.now();
  const late = iso(Date.now()) > addDays(r.start, r.days); let msg;
  if (late && r.role === "borrower") { me.streak = 0; msg = "Checked in late. Your streak starts over."; }
  else { me.streak++; msg = `Done. ${me.streak}-day streak 🔥`; }
  if (r.role === "borrower") { me.borrowed++; if (r.deposit) msg = "Deposit released. " + msg; }
  else { me.lent++; me.earned = r2(me.earned + r.cost); me.monthly[4] = r2(me.monthly[4] + r.cost); if (r.kind === "bounty") me.bounties++; msg = `You earned ${eur(r.cost)}. ` + msg; }
  const l = r.listingId && getListing(r.listingId);
  if (l && l.kind === "lend") l.status = "available";
  const t = r.threadId && getThread(r.threadId); if (t) addMsg(t, "sys", "Checked back in. Both sides can rate the handoff.");
  save(); closeSheet(); toast(msg); refresh(); celebrate();
}

const CHEV = '<svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>';
const moreSum = p => p.kind === "borrow" ? (p.urgent ? "Needed this week" : "Standard") : `${plural(p.maxDays,"day")} max · offers ${p.acceptOffers ? "on" : "off"}`;
function toggleAcc(btn, k){ ui.acc[k] = !ui.acc[k]; btn.parentElement.classList.toggle("open", ui.acc[k]); btn.setAttribute("aria-expanded", ui.acc[k]); }
function flip(btn, f){ ui.post[f] = !ui.post[f]; btn.classList.toggle("on", ui.post[f]); btn.setAttribute("aria-checked", ui.post[f]); updPost(); }
function setKind(k){ if (ui.post.kind === k) return; ui.kindFrom = ui.post.kind === "borrow" ? 1 : 0; ui.post.kind = k; render(); }
function post(){
  const p = ui.post, wish = p.kind === "borrow", edit = !!p.id; ui.acc = ui.acc || {};
  const idx = wish ? 1 : 0, from = ui.kindFrom ?? idx;
  const sw = (label, sub, on, f) => `<div class="setrow"><span>${label}<div class="small">${sub}</div></span><button class="switch ${on?"on":""}" role="switch" aria-checked="${on}" aria-label="${label}" onclick="flip(this,'${f}')"></button></div>`;
  const field = (label, inner, right = "") => `<div style="min-width:0"><div class="label"><span>${label}</span>${right}</div>${inner}</div>`;
  const opts = (list, cur) => list.map(([v,t]) => `<option value="${v}" ${String(cur)===String(v)?"selected":""}>${t}</option>`).join("");
  const catSel = `<select class="input" aria-label="Category" onchange="ui.post.category=this.value;updPost()">${opts(CATEGORIES.map(([n,e]) => [n, e + " " + n]), p.category)}</select>`;
  const condSel = `<select class="input" aria-label="Condition" onchange="ui.post.condition=this.value;updPost()">${opts(["Like new","Good","Well used"].map(c => [c,c]), p.condition)}</select>`;
  const maxSel = `<div class="setrow"><span>Max rental length</span><select class="input" style="width:auto;min-width:110px" aria-label="Max rental length" onchange="ui.post.maxDays=+this.value;updPost()">${opts([1,3,7,14,30].map(d => [d, plural(d,"day")]), p.maxDays)}</select></div>`;
  const acc = (k, title, sum, sumId, body) => `<div class="acc ${ui.acc[k]?"open":""}"><button class="acc-h press" aria-expanded="${!!ui.acc[k]}" onclick="toggleAcc(this,'${k}')"><span>${title}</span><span class="small" ${sumId?`id="${sumId}"`:""}>${sum}</span>${CHEV}</button><div class="acc-b"><div>${body}</div></div></div>`;
  const photos = wish ? "" : `<div class="label"><span>Photos</span><span>${p.photos.length}/6 · first is the cover</span></div>
    <div class="photos row">${p.photos.length<6?`<label class="add">📸<br>${p.photos.length?"Add more":"Add photos"}<input type="file" accept="image/*" multiple hidden onchange="addPhotos(this)"></label>`:""}
      ${p.photos.map((src,i) => `<div><img src="${src}" alt="Photo ${i+1}"><button class="rm" aria-label="Remove photo ${i+1}" onclick="rmPhoto(${i})">✕</button></div>`).join("")}</div>`;
  const body = wish ? `
    <div class="grid">${field("Category", catSel)}${field("Bounty (€)", `<input class="input" type="number" inputmode="decimal" min="0" step="1" value="${p.price}" aria-label="Bounty in euros" oninput="ui.post.price=num(this.value);updPost()">`)}</div>

function shrink(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .72));
      };
      img.onerror = rej; img.src = rd.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

    toast(`${r.other} declined your offer`); return;

      <div class="row between"><b style="font-size:14px">Return streak</b><span class="small">${me.streak} ${me.streak===1?"day":"days"}</span></div>
      <div class="flames" style="font-size:22px;margin-top:8px">${me.streak?"🔥".repeat(Math.min(me.streak,5)):'<span class="small">Return something on time to start a streak.</span>'}</div>
      <div class="badges">${badges.map(([i,n,on]) => `<div class="bdg ${on?"on":""}"><b>${i}</b>${n}</div>`).join("")}</div>
    </div>

    <div class="panel" style="margin-top:12px">
      <div class="small">Earned this month</div>
      <div class="row between" style="margin-top:4px"><b class="glow" style="font-size:28px">${eur(cur)}</b>${prev?`<span class="small" style="color:${delta>=0?"var(--lend)":"var(--hot)"}">${delta>=0?"▲":"▼"} ${Math.abs(delta)}% vs last month</span>`:""}</div>
      <div class="bars" role="img" aria-label="Earnings over the last 5 months">${me.monthly.map((v,i) => `<div class="bar"><span class="small">${eur(v)}</span><i class="${i===4?"cur":""}" style="height:${Math.max(6, Math.round(v/max*64))}px"></i><span class="small">${months[i]}</span></div>`).join("")}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">
      ${[[eur(me.earned),"Earned"],[eur(held),"Deposits held"],[live,"Active listings"],[me.lent,"Lent"],[me.borrowed,"Borrowed"],[me.bounties,"Bounties filled"]].map(([n,l]) => `<div class="stat"><b class="glow" style="font-size:16px">${n}</b><span class="small" style="font-size:9px">${l.toUpperCase()}</span></div>`).join("")}
    </div>

    <div class="section">Checkout cards</div>
    ${active.length ? fold("co", active, coCard, "checkout cards") : `<p class="small" style="border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;line-height:1.5">No active cards. Send an offer from the feed and it shows up here.</p>`}
    ${hist.length ? `<div class="small" style="margin:16px 0 8px">Recent history</div>${fold("hist", hist, coCard, "from history")}` : ""}

    <div class="section">Your listings</div>
    ${mine.length ? `<ul class="list">${mine.map(l => { const [t,c] = pillFor(l); return rowFor(l, `<span class="pill ${c}">${t}</span>`); }).join("")}</ul>`
      : `<p class="small" style="border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center">Nothing posted yet. Tap Post to put something on the board.</p>`}

    ${saved.length ? `<div class="section">Saved</div><ul class="list">${saved.map(l => rowFor(l, badge(l.kind))).join("")}</ul>` : ""}

    <div class="section">Settings</div>
    <div class="panel" style="padding:4px 16px">
      <div class="setrow"><span>Dark mode<div class="small">Dimmed surfaces for night-time use</div></span><button class="switch ${document.documentElement.dataset.theme!=="light"?"on":""}" role="switch" aria-checked="${document.documentElement.dataset.theme!=="light"}" aria-label="Dark mode" onclick="toggleTheme()"></button></div>
      ${toggle("requests","Borrow requests","Push and email when someone asks")}
      ${toggle("bounties","Bounty alerts","When a wish matches your stuff")}
      ${toggle("campus","Show my campus publicly",esc(me.campus)+" shown on listings")}
      <button class="setrow press" style="width:100%;text-align:left" onclick="openSheet({t:'payout'})"><span>Payout method<div class="small">${esc(me.payout)}</div></span><span class="small">›</span></button>
      <button class="setrow press" style="width:100%;text-align:left" onclick="ui.tmp={pickup:db.me.pickup};openSheet({t:'pickup'})"><span>Pickup address<div class="small">${esc(me.pickup||"Not set")}</div></span><span class="small">›</span></button>
      <button class="setrow press" style="width:100%;text-align:left;border:0" onclick="openSheet({t:'help'})"><span>How it works &amp; support</span><span class="small">›</span></button>
    </div>
    <div style="height:20px"></div>
    <div class="sign">${mango("logo-mango")}<span>Mazingo · Borrow first.</span></div>
    <button class="small press" onclick="if(confirm('Reset demo data? This deletes your listings and chats.')){localStorage.removeItem(KEY);localStorage.removeItem(OLD);location.reload()}">Reset demo data</button>`;
}

/* ---------- Render ---------- */
function patchChat(){
  const ms = $("msgs"), near = ms.scrollHeight - ms.scrollTop - ms.clientHeight < 160;
  const tmp = document.createElement("div"); tmp.innerHTML = texts();
  ms.innerHTML = tmp.querySelector("#msgs").innerHTML; $("offerslot").innerHTML = tmp.querySelector("#offerslot").innerHTML;
  if (near) ms.scrollTop = ms.scrollHeight;
  renderTabs();
}
function render(){
  if (ui.tab === "texts" && ui.thread && $("msgs") && $("app").dataset.thread === String(ui.thread)) return patchChat();
  const keep = $("msg"), val = keep ? keep.value : null, focused = keep && document.activeElement === keep;
  $("app").innerHTML = ({feed, post, texts, profile})[ui.tab]();
  renderTabs(); document.body.classList.toggle("inchat", ui.tab === "texts" && !!ui.thread);
  const m = $("msg"); if (m && val !== null) { m.value = val; if (focused) m.focus(); }
  const ms = $("msgs"); if (ms) ms.scrollTop = ms.scrollHeight;
  if (ui.tab === "texts" && ui.thread) $("app").dataset.thread = ui.thread; else delete $("app").dataset.thread;
  runInd(); ui.segFrom = null; ui.kindFrom = null;
}
function refresh(){
  renderTabs();
  if (ui.tab === "feed") renderList(); else if (ui.tab !== "post") render();
  if (ui.sheet) renderSheet();
}
$("top").innerHTML = `<div class="in">${logo()}<span class="small row" style="gap:6px"><span class="dot pulse"></span><span id="live">${liveCount()} live</span></span></div>`;
render();
(function splash(){
  try { if (sessionStorage.getItem("mzSplash")) return; sessionStorage.setItem("mzSplash","1"); } catch {}
  const el = document.createElement("div"); el.id = "splash";
  el.innerHTML = `<div class="sp-in"><div class="sp-mango">${mango()}</div><div class="sp-word">mazingo</div><div class="sp-tag">Borrow first. <span class="strike">Buy never.</span></div></div>`;
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  const end = () => { el.classList.add("out"); document.body.style.overflow = ""; setTimeout(() => el.remove(), 450); };
  el.onclick = end;
  setTimeout(() => { const r = el.querySelector(".sp-mango").getBoundingClientRect(); burst(r.left + r.width/2, r.bottom, 24); }, 560);
  setTimeout(end, 2300);
})();

/* ---------- iPhone behaviour ---------- */
document.addEventListener("touchstart", () => {}, {passive:true}); /* enables :active on iOS */
(function(){
  const vv = window.visualViewport;
  
  document.addEventListener("focusin", e => {
    if (e.target.matches("input,textarea") && e.target.id !== "msg") setTimeout(() => e.target.scrollIntoView({block:"center", behavior:"smooth"}), 320);
  });
  document.addEventListener("touchstart", e => { /* swipe a sheet down to close it */
    const g = e.target.closest && e.target.closest(".grab"); if (!g) return;
    const sh = g.closest(".sheet"), y0 = e.touches[0].clientY; let dy = 0; sh.style.transition = "none";
    const mv = ev => { dy = Math.max(0, ev.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
    const en = () => { g.removeEventListener("touchmove", mv); g.removeEventListener("touchend", en); g.removeEventListener("touchcancel", en);
      sh.style.transition = "transform .2s";
      if (dy > 90) { sh.style.transform = "translateY(100%)"; setTimeout(closeSheet, 180); } else sh.style.transform = ""; };
    g.addEventListener("touchmove", mv, {passive:true}); g.addEventListener("touchend", en); g.addEventListener("touchcancel", en);
  }, {passive:true});
})();

/* ---------- Fullscreen photo viewer ---------- */
function openLB(id, i = 0){
  const l = getListing(id), ph = l ? photosOf(l) : []; if (!ph.length) return;
  closeLB();
  const el = document.createElement("div"); el.id = "lb"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Photo viewer");
  el.innerHTML = `<div class="lb-top"><span id="lbn" style="font-size:13px">${i+1} / ${ph.length}</span><button class="lb-x press" aria-label="Close photo" onclick="closeLB()">✕</button></div>
    <div class="lb-sc" id="lbs">${ph.map(p => `<div class="lb-slide"><img src="${p}" alt="${esc(l.title)}"></div>`).join("")}</div>
    <div class="lb-cap">${esc(l.title)}<small>Tap photo to zoom${ph.length>1?" · swipe for more":""}</small></div>`;
  document.body.appendChild(el);
  const sc = $("lbs"); sc.scrollLeft = i * sc.clientWidth;
  sc.addEventListener("scroll", () => { const n = Math.round(sc.scrollLeft / sc.clientWidth); $("lbn").textContent = `${n+1} / ${ph.length}`; }, {passive:true});
  sc.querySelectorAll(".lb-slide").forEach(sl => sl.addEventListener("click", ev => {
    const z = sl.classList.toggle("z"); sc.style.overflowX = z ? "hidden" : "";
    if (z) { sl.scrollLeft = (sl.scrollWidth - sl.clientWidth) / 2; sl.scrollTop = (sl.scrollHeight - sl.clientHeight) / 2; }
    ev.stopPropagation();
  }));
}
function closeLB(){ const el = $("lb"); if (el) el.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("lb")) { e.stopPropagation(); closeLB(); } }, true);

/* ---------- Keyboard-safe viewport (iPhone) ---------- */
const KBTYPES = /^(text|search|number|tel|email|url|password|date)$/;
function isTyping(){ const a = document.activeElement; return !!a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && KBTYPES.test(a.type))); }
function setKb(){ const vv = window.visualViewport; document.body.classList.toggle("kb", isTyping() || (vv ? innerHeight - vv.height > 120 : false)); }
function resetViewport(){ scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
let _vpRaf = 0;
function syncViewport(){ if (_vpRaf) return; _vpRaf = requestAnimationFrame(() => { _vpRaf = 0; doSyncViewport(); }); }
function doSyncViewport(){
  const vv = window.visualViewport, r = document.documentElement.style; setKb();
  if (vv && document.body.classList.contains("kb")) { r.setProperty("--vh", vv.height + "px"); r.setProperty("--vt", vv.offsetTop + "px"); }
  else { r.removeProperty("--vh"); r.removeProperty("--vt"); }
  if (document.body.classList.contains("inchat") && scrollY) scrollTo(0, 0);
  const ms = $("msgs"); if (ms && document.body.classList.contains("kb")) ms.scrollTop = ms.scrollHeight;
}
(function(){
  const vv = window.visualViewport;
  if (vv) { vv.addEventListener("resize", syncViewport); vv.addEventListener("scroll", syncViewport); }
  addEventListener("resize", syncViewport); addEventListener("orientationchange", () => setTimeout(syncViewport, 300));
  document.addEventListener("focusin", () => { syncViewport(); setTimeout(syncViewport, 250); });
  document.addEventListener("focusout", () => {
    setTimeout(syncViewport, 30);
    [120, 350, 700].forEach(t => setTimeout(() => { if (!isTyping()) { resetViewport(); syncViewport(); } }, t)); /* iOS can leave the page shifted after the keyboard closes */
  });
  syncViewport();
})();
</script>
